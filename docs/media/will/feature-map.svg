<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Deepseek Harness Will 功能总览</title>
  <desc id="desc">以双语卡片展示桌面发行版的八项核心能力。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07141f"/><stop offset="1" stop-color="#112b36"/></linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#62f0b5"/><stop offset="1" stop-color="#61dafb"/></linearGradient>
  </defs>
  <rect width="1400" height="760" rx="34" fill="url(#bg)"/>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Noto Sans SC, sans-serif">
    <text x="700" y="70" text-anchor="middle" font-size="34" font-weight="800" fill="#f2fbff">核心能力 · Core capabilities</text>
    <rect x="520" y="91" width="360" height="4" rx="2" fill="url(#line)"/>

    <g transform="translate(60 132)">
      <rect width="300" height="250" rx="22" fill="#112d38" stroke="#28505d"/>
      <circle cx="50" cy="50" r="25" fill="#2c766c"/><text x="50" y="58" text-anchor="middle" font-size="25" fill="#fff">↯</text>
      <text x="30" y="104" font-size="21" font-weight="750" fill="#effbff">开箱即用</text><text x="30" y="133" font-size="16" fill="#8fb6c3">Ready out of the box</text>
      <text x="30" y="174" font-size="15" fill="#c6dce3">内置 Node/npm 与官方 dsh</text><text x="30" y="201" font-size="14" fill="#819faa">Bundled runtime and agent</text>
    </g>
    <g transform="translate(386 132)">
      <rect width="300" height="250" rx="22" fill="#112d38" stroke="#28505d"/>
      <circle cx="50" cy="50" r="25" fill="#356d8b"/><text x="50" y="58" text-anchor="middle" font-size="25" fill="#fff">▣</text>
      <text x="30" y="104" font-size="21" font-weight="750" fill="#effbff">原生桌面体验</text><text x="30" y="133" font-size="16" fill="#8fb6c3">Native desktop experience</text>
      <text x="30" y="174" font-size="15" fill="#c6dce3">窗口、托盘、通知、单实例</text><text x="30" y="201" font-size="14" fill="#819faa">Window, tray, alerts, single instance</text>
    </g>
    <g transform="translate(712 132)">
      <rect width="300" height="250" rx="22" fill="#112d38" stroke="#28505d"/>
      <circle cx="50" cy="50" r="25" fill="#765d94"/><text x="50" y="58" text-anchor="middle" font-size="23" fill="#fff">◈</text>
      <text x="30" y="104" font-size="21" font-weight="750" fill="#effbff">10 套可选皮肤</text><text x="30" y="133" font-size="16" fill="#8fb6c3">10 optional palettes</text>
      <text x="30" y="174" font-size="15" fill="#c6dce3">默认保持官方原生外观</text><text x="30" y="201" font-size="14" fill="#819faa">Upstream look stays the default</text>
    </g>
    <g transform="translate(1038 132)">
      <rect width="300" height="250" rx="22" fill="#112d38" stroke="#28505d"/>
      <circle cx="50" cy="50" r="25" fill="#8b6741"/><text x="50" y="58" text-anchor="middle" font-size="23" fill="#fff">¥</text>
      <text x="30" y="104" font-size="21" font-weight="750" fill="#effbff">余额查看</text><text x="30" y="133" font-size="16" fill="#8fb6c3">Balance overview</text>
      <text x="30" y="174" font-size="15" fill="#c6dce3">密钥不进入渲染器 IPC</text><text x="30" y="201" font-size="14" fill="#819faa">API key stays in the main process</text>
    </g>

    <g transform="translate(60 410)">
      <rect width="300" height="250" rx="22" fill="#112d38" stroke="#28505d"/>
      <circle cx="50" cy="50" r="25" fill="#5d7960"/><text x="50" y="58" text-anchor="middle" font-size="23" fill="#fff">✦</text>
      <text x="30" y="104" font-size="21" font-weight="750" fill="#effbff">soul.md 人设</text><text x="30" y="133" font-size="16" fill="#8fb6c3">Editable persona</text>
      <text x="30" y="174" font-size="15" fill="#c6dce3">独立 patch，不覆盖上游配置</text><text x="30" y="201" font-size="14" fill="#819faa">Isolated patch, upstream-safe</text>
    </g>
    <g transform="translate(386 410)">
      <rect width="300" height="250" rx="22" fill="#112d38" stroke="#28505d"/>
      <circle cx="50" cy="50" r="25" fill="#3c6d65"/><text x="50" y="58" text-anchor="middle" font-size="22" fill="#fff">&gt;_</text>
      <text x="30" y="104" font-size="21" font-weight="750" fill="#effbff">持久终端</text><text x="30" y="133" font-size="16" fill="#8fb6c3">Persistent terminal</text>
      <text x="30" y="174" font-size="15" fill="#c6dce3">页面重载后继续并回放输出</text><text x="30" y="201" font-size="14" fill="#819faa">Survives reloads and replays output</text>
    </g>
    <g transform="translate(712 410)">
      <rect width="300" height="250" rx="22" fill="#112d38" stroke="#28505d"/>
      <circle cx="50" cy="50" r="25" fill="#6c5a88"/><text x="50" y="58" text-anchor="middle" font-size="23" fill="#fff">⬡</text>
      <text x="30" y="104" font-size="21" font-weight="750" fill="#effbff">插件管理</text><text x="30" y="133" font-size="16" fill="#8fb6c3">Plugin operations</text>
      <text x="30" y="174" font-size="15" fill="#c6dce3">明确风险提示与安全重启</text><text x="30" y="201" font-size="14" fill="#819faa">Risk warning and safe restart</text>
    </g>
    <g transform="translate(1038 410)">
      <rect width="300" height="250" rx="22" fill="#112d38" stroke="#28505d"/>
      <circle cx="50" cy="50" r="25" fill="#45708d"/><text x="50" y="58" text-anchor="middle" font-size="23" fill="#fff">↻</text>
      <text x="30" y="104" font-size="21" font-weight="750" fill="#effbff">双层更新</text><text x="30" y="133" font-size="16" fill="#8fb6c3">Two-layer updates</text>
      <text x="30" y="174" font-size="15" fill="#c6dce3">agent 回退 + 客户端更新</text><text x="30" y="201" font-size="14" fill="#819faa">Agent rollback + app updates</text>
    </g>
  </g>
</svg>
