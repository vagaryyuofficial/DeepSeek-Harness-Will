      <rect x="824" y="542" width="208" height="118" rx="14" fill="#f2f6f7" stroke="#dbe5e8"/>
      <text x="844" y="572" font-size="16" font-weight="750" fill="#243b44">插件 · Plugins</text><text x="844" y="598" font-size="11" fill="#75888f">安装前显示代码执行警告</text><rect x="844" y="618" width="72" height="24" rx="7" fill="#2d8f7b"/><text x="880" y="634" text-anchor="middle" font-size="10" fill="#fff">安装</text>
      <rect x="1044" y="542" width="208" height="118" rx="14" fill="#f2f6f7" stroke="#dbe5e8"/>
      <text x="1064" y="572" font-size="16" font-weight="750" fill="#243b44">更新 · Updates</text><text x="1064" y="598" font-size="11" fill="#75888f">agent 自检、轮换与回退</text><rect x="1064" y="618" width="82" height="24" rx="7" fill="#2d8f7b"/><text x="1105" y="634" text-anchor="middle" font-size="10" fill="#fff">检查更新</text>
