      <rect x="1140" y="11" width="118" height="28" rx="8" fill="#26796d"/><text x="1199" y="30" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">组装未来设置</text>

      <rect y="50" width="800" height="650" fill="#edf1f3"/>
      <rect x="0" y="50" width="180" height="650" fill="#e1e7ea"/>
      <rect x="18" y="78" width="144" height="40" rx="10" fill="#c8e7df"/>
