<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" role="img" aria-labelledby="title desc">
  <title id="title">Windows 和 macOS 安装选择</title>
  <desc id="desc">展示四种正式发行资产及其适用平台。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07141f"/><stop offset="1" stop-color="#112b36"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10z" fill="#65d9bd"/></marker></defs>
  <rect width="1400" height="560" rx="34" fill="url(#bg)"/>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Noto Sans SC, sans-serif">
    <text x="700" y="68" text-anchor="middle" font-size="34" font-weight="800" fill="#f2fbff">选择你的版本 · Choose your build</text>
    <text x="700" y="101" text-anchor="middle" font-size="15" fill="#8fb3bf">所有正式包都内置运行时，无需预装 Node.js · Every release bundle includes its runtime</text>

    <rect x="54" y="146" width="616" height="340" rx="26" fill="#122f3b" stroke="#315e6d"/>
    <text x="86" y="190" font-size="28" font-weight="800" fill="#eaf9ff">Windows 10/11 · x64</text>
    <rect x="86" y="222" width="250" height="190" rx="20" fill="#f4f8fa"/>
    <text x="111" y="262" font-size="20" font-weight="800" fill="#17313c">安装版 · Setup</text><text x="111" y="292" font-size="14" fill="#5a727c">开始菜单与桌面快捷方式</text><text x="111" y="316" font-size="13" fill="#7b8e96">Start Menu &amp; desktop shortcut</text><rect x="111" y="348" width="156" height="34" rx="10" fill="#2c8e79"/><text x="189" y="371" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">Setup-0.1.3-x64.exe</text>
    <rect x="362" y="222" width="276" height="190" rx="20" fill="#f4f8fa"/>
    <text x="387" y="262" font-size="20" font-weight="800" fill="#17313c">便携版 · Portable</text><text x="387" y="292" font-size="14" fill="#5a727c">数据跟随 exe 旁的数据目录</text><text x="387" y="316" font-size="13" fill="#7b8e96">Data stays beside the executable</text><rect x="387" y="348" width="190" height="34" rx="10" fill="#2c8e79"/><text x="482" y="371" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">Portable-0.1.3-x64.exe</text>
    <text x="86" y="450" font-size="13" fill="#91b6c2">客户端本体支持用户确认后的自动更新 · App update available after user confirmation</text>

    <rect x="730" y="146" width="616" height="340" rx="26" fill="#122f3b" stroke="#315e6d"/>
    <text x="762" y="190" font-size="28" font-weight="800" fill="#eaf9ff">macOS 12+</text>
    <rect x="762" y="222" width="250" height="190" rx="20" fill="#f4f8fa"/>
    <text x="787" y="262" font-size="20" font-weight="800" fill="#17313c">Apple Silicon</text><text x="787" y="292" font-size="14" fill="#5a727c">M1、M2、M3、M4 及更新</text><text x="787" y="316" font-size="13" fill="#7b8e96">Native arm64 build</text><rect x="787" y="348" width="160" height="34" rx="10" fill="#2c8e79"/><text x="867" y="371" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">macOS-arm64.dmg</text>
    <rect x="1038" y="222" width="276" height="190" rx="20" fill="#f4f8fa"/>
    <text x="1063" y="262" font-size="20" font-weight="800" fill="#17313c">Intel Mac</text><text x="1063" y="292" font-size="14" fill="#5a727c">Intel 处理器 Mac 电脑</text><text x="1063" y="316" font-size="13" fill="#7b8e96">Native x64 build</text><rect x="1063" y="348" width="150" height="34" rx="10" fill="#2c8e79"/><text x="1138" y="371" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">macOS-x64.dmg</text>
    <text x="762" y="450" font-size="13" fill="#91b6c2">当前未签名/公证；请核对来源并按 Control 打开 · Currently unsigned/not notarized</text>
  </g>
</svg>
