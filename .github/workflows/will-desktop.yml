name: DeepSeek Harness Will desktop

on:
  push:
    branches: [main]
    tags: ['will-v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

permissions:
  contents: write

env:
  NODE_VERSION: '24.18.0'
  PNPM_VERSION: '11.7.0'
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  windows-x64:
    name: Windows 10/11 x64 portable and installer
    runs-on: windows-2025
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install immutable workspace
        run: pnpm install --frozen-lockfile

      - name: Build official Harness and Will shell
        run: |
          pnpm run build
          pnpm --filter @deepseek-harness-will/desktop run build

      - name: Test Will customizations
        run: pnpm --filter @deepseek-harness-will/desktop run test

      - name: Provision verified standalone Node and npm
        run: |
          $archive = "node-v$env:NODE_VERSION-win-x64.zip"
          $base = "https://nodejs.org/dist/v$env:NODE_VERSION"
          $download = Join-Path $env:RUNNER_TEMP $archive
          $checksums = Join-Path $env:RUNNER_TEMP 'SHASUMS256.txt'
          $extract = Join-Path $env:RUNNER_TEMP 'will-node'
          $destination = Join-Path $env:GITHUB_WORKSPACE 'apps/will-desktop/runtime/node'
          Invoke-WebRequest -Uri "$base/$archive" -OutFile $download
          Invoke-WebRequest -Uri "$base/SHASUMS256.txt" -OutFile $checksums
          $match = Select-String -Path $checksums -Pattern "  $([regex]::Escape($archive))$"
          if ($null -eq $match) { throw "Node checksum entry is missing for $archive" }
          $expected = ($match.Line -split '\s+')[0].ToLowerInvariant()
          $actual = (Get-FileHash -Algorithm SHA256 $download).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Node checksum mismatch: expected $expected, got $actual" }
          Expand-Archive -Path $download -DestinationPath $extract
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          Copy-Item -Path (Join-Path $extract "node-v$env:NODE_VERSION-win-x64/*") -Destination $destination -Recurse -Force
          & (Join-Path $destination 'node.exe') --version
          & (Join-Path $destination 'npm.cmd') --version

      - name: Package unsigned Windows artifacts
        run: pnpm --filter @deepseek-harness-will/desktop exec electron-builder --win nsis portable --x64 --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: DeepSeek-Harness-Will-windows-x64
          path: |
            apps/will-desktop/release/DeepSeek-Harness-Will-Setup-*.exe
            apps/will-desktop/release/DeepSeek-Harness-Will-Setup-*.exe.blockmap
            apps/will-desktop/release/DeepSeek-Harness-Will-Portable-*.exe
            apps/will-desktop/release/latest.yml
          if-no-files-found: error


  macos:
    name: macOS ${{ matrix.arch }} DMG
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
            node_platform: darwin-arm64
          - arch: x64
            runner: macos-15-intel
            node_platform: darwin-x64

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install immutable workspace
        run: pnpm install --frozen-lockfile

      - name: Build official Harness and Will shell
        run: |
          pnpm run build
          pnpm --filter @deepseek-harness-will/desktop run build

      - name: Test Will customizations
        run: pnpm --filter @deepseek-harness-will/desktop run test

      - name: Provision verified standalone Node and npm
        run: |
          archive="node-v${NODE_VERSION}-${{ matrix.node_platform }}.tar.gz"
          base="https://nodejs.org/dist/v${NODE_VERSION}"
          download="$RUNNER_TEMP/$archive"
          checksums="$RUNNER_TEMP/SHASUMS256.txt"
          destination="$GITHUB_WORKSPACE/apps/will-desktop/runtime/node"
          curl --fail --location --output "$download" "$base/$archive"
          curl --fail --location --output "$checksums" "$base/SHASUMS256.txt"
          expected="$(awk -v archive="$archive" '$2 == archive { print $1 }' "$checksums")"
          test -n "$expected"
          actual="$(shasum -a 256 "$download" | awk '{ print $1 }')"
          test "$actual" = "$expected"
          mkdir -p "$destination"
          tar -xzf "$download" --strip-components=1 -C "$destination"
          "$destination/bin/node" --version
          "$destination/bin/npm" --version

      - name: Package unsigned macOS artifact
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: pnpm --filter @deepseek-harness-will/desktop exec electron-builder --mac dmg --${{ matrix.arch }} --publish never

      - name: Smoke-test packaged macOS application
        run: |
          executable="apps/will-desktop/release/mac-${{ matrix.arch }}/DeepSeek Harness Will.app/Contents/MacOS/DeepSeek Harness Will"
          smoke="$RUNNER_TEMP/will-smoke.json"
          data="$RUNNER_TEMP/will-smoke-data"
          WILL_DATA_DIR="$data" WILL_SMOKE_FILE="$smoke" WILL_SMOKE_EXIT=1 "$executable" &
          pid=$!
          for attempt in {1..90}; do
            if test -f "$smoke"; then break; fi
            if ! kill -0 "$pid" 2>/dev/null; then break; fi
            sleep 2
          done
          test -f "$smoke"
          node -e 'const result = require(process.argv[1]); if (result.status !== "ready") throw new Error(JSON.stringify(result))' "$smoke"
          wait "$pid"

      - uses: actions/upload-artifact@v4
        with:
          name: DeepSeek-Harness-Will-macOS-${{ matrix.arch }}
          path: apps/will-desktop/release/DeepSeek-Harness-Will-*-macOS-${{ matrix.arch }}.dmg
          if-no-files-found: error

  release:
    name: Publish tagged GitHub Release
    if: startsWith(github.ref, 'refs/tags/will-v')
    needs: [windows-x64, macos]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v5
        with:
          pattern: DeepSeek-Harness-Will-*
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release with Windows and macOS assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#will-v}"
          gh release create "$GITHUB_REF_NAME" release-assets/* --verify-tag --notes-file .github/release-notes/current.txt --title "DeepSeek Harness Will v$version"
