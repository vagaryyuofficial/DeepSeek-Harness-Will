name: DeepSeek Harness Will desktop

on:
  push:
    branches: [main]
    tags: ['will-v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

permissions:
  contents: read

env:
  NODE_VERSION: '24.18.0'
  PNPM_VERSION: '11.7.0'
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  windows-x64:
    name: Windows 10/11 x64 portable and installer
    runs-on: windows-2025
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Require the release tag to match the desktop version
        if: startsWith(github.ref, 'refs/tags/will-v')
        run: |
          $expected = $env:GITHUB_REF_NAME -replace '^will-v', ''
          $actual = node -p "require('./apps/will-desktop/package.json').version"
          if ($actual -ne $expected) {
            throw "Release tag $env:GITHUB_REF_NAME does not match desktop version $actual"
          }

      - name: Require Authenticode credentials for tagged releases
        if: startsWith(github.ref, 'refs/tags/will-v')
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          $missing = @()
          if ([string]::IsNullOrWhiteSpace($env:WIN_CSC_LINK)) { $missing += 'WIN_CSC_LINK' }
          if ([string]::IsNullOrWhiteSpace($env:WIN_CSC_KEY_PASSWORD)) { $missing += 'WIN_CSC_KEY_PASSWORD' }
          if ($missing.Count -gt 0) {
            throw "Tagged Windows releases require Authenticode credentials. Missing GitHub Actions secrets: $($missing -join ', ')"
          }

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install immutable workspace
        run: pnpm install --frozen-lockfile

      - name: Build official Harness and Will shell
        run: |
          pnpm run build
          pnpm --filter @deepseek-harness-will/desktop run build

      - name: Test Will customizations
        run: pnpm --filter @deepseek-harness-will/desktop run test

      - name: Provision verified standalone Node and npm
        run: |
          $archive = "node-v$env:NODE_VERSION-win-x64.zip"
          $base = "https://nodejs.org/dist/v$env:NODE_VERSION"
          $download = Join-Path $env:RUNNER_TEMP $archive
          $checksums = Join-Path $env:RUNNER_TEMP 'SHASUMS256.txt'
          $extract = Join-Path $env:RUNNER_TEMP 'will-node'
          $destination = Join-Path $env:GITHUB_WORKSPACE 'apps/will-desktop/runtime/node'
          Invoke-WebRequest -Uri "$base/$archive" -OutFile $download
          Invoke-WebRequest -Uri "$base/SHASUMS256.txt" -OutFile $checksums
          $match = Select-String -Path $checksums -Pattern "  $([regex]::Escape($archive))$"
          if ($null -eq $match) { throw "Node checksum entry is missing for $archive" }
          $expected = ($match.Line -split '\s+')[0].ToLowerInvariant()
          $actual = (Get-FileHash -Algorithm SHA256 $download).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Node checksum mismatch: expected $expected, got $actual" }
          Expand-Archive -Path $download -DestinationPath $extract
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          Copy-Item -Path (Join-Path $extract "node-v$env:NODE_VERSION-win-x64/*") -Destination $destination -Recurse -Force
          & (Join-Path $destination 'node.exe') --version
          & (Join-Path $destination 'npm.cmd') --version

      - name: Package unsigned Windows artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/will-v') }}
        run: pnpm --filter @deepseek-harness-will/desktop exec electron-builder --win nsis portable --x64 --publish never

      - name: Package signed Windows release artifacts
        if: startsWith(github.ref, 'refs/tags/will-v')
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: pnpm --filter @deepseek-harness-will/desktop exec electron-builder --win nsis portable --x64 --publish never

      - name: Verify unpacked Windows runtime and Harness
        run: |
          $release = Join-Path $env:GITHUB_WORKSPACE 'apps/will-desktop/release'
          $unpacked = Join-Path $release 'win-unpacked'
          $productName = node -p "require('./apps/will-desktop/package.json').build.productName"
          $executable = Join-Path $unpacked "$productName.exe"
          $resources = Join-Path $unpacked 'resources'
          $runtime = Join-Path $resources 'runtime/node/node.exe'

          foreach ($required in @(
            $executable,
            $runtime,
            (Join-Path $resources 'app.asar'),
            (Join-Path $resources 'app.asar.unpacked/node_modules/@deepseek-ai/dsh/lib/bin.js'),
            (Join-Path $resources 'app.asar.unpacked/node_modules/pnpm/bin/pnpm.mjs')
          )) {
            if (-not (Test-Path -LiteralPath $required -PathType Leaf)) {
              throw "Packaged Windows runtime is missing: $required"
            }
          }

          if ((& $runtime -p 'process.platform') -ne 'win32') { throw 'Bundled Node is not a Windows runtime' }
          if ((& $runtime -p 'process.arch') -ne 'x64') { throw 'Bundled Node is not x64' }
          if ((& $runtime --version) -ne "v$env:NODE_VERSION") { throw 'Bundled Node version does not match the release runtime' }

          node apps/will-desktop/scripts/smoke-packaged-harness.mjs `
            --executable $executable `
            --resources $resources

      - name: Smoke win-unpacked, Portable, and NSIS shells
        run: |
          function Write-WillDesktopSmokeDiagnostics {
            param(
              [Parameter(Mandatory)][System.Diagnostics.Process] $Launcher,
              [Parameter(Mandatory)][datetime] $StartedAt,
              [Parameter(Mandatory)][string] $Label,
              [string[]] $DiagnosticFiles = @()
            )

            Write-Host "::group::$Label startup diagnostics"
            $elapsed = [math]::Round(((Get-Date) - $StartedAt).TotalSeconds, 1)
            Write-Host "launcher pid=$($Launcher.Id) exited=$($Launcher.HasExited) elapsed=${elapsed}s"

            $processes = @(Get-CimInstance Win32_Process -ErrorAction SilentlyContinue)
            $relatedProcessIds = @($Launcher.Id)
            while ($true) {
              $children = @(
                $processes |
                  Where-Object {
                    $_.ParentProcessId -in $relatedProcessIds -and
                    $_.ProcessId -notin $relatedProcessIds
                  } |
                  Select-Object -ExpandProperty ProcessId
              )
              if ($children.Count -eq 0) { break }
              $relatedProcessIds += $children
            }
            $processes |
              Where-Object { $_.ProcessId -in $relatedProcessIds } |
              Select-Object ProcessId, ParentProcessId, Name, ExecutablePath, CommandLine |
              Format-List |
              Out-String -Width 4096 |
              Write-Host

            foreach ($candidate in $DiagnosticFiles) {
              if (Test-Path -LiteralPath $candidate -PathType Leaf) {
                $item = Get-Item -LiteralPath $candidate
                Write-Host "diagnostic file: $candidate ($($item.Length) bytes)"
                Get-Content -LiteralPath $candidate -Raw -ErrorAction SilentlyContinue | Write-Host
              } else {
                Write-Host "diagnostic file missing: $candidate"
              }
            }

            @($env:TEMP, $env:RUNNER_TEMP) |
              Where-Object { -not [string]::IsNullOrWhiteSpace($_) } |
              Select-Object -Unique |
              ForEach-Object {
                $tempRoot = $_
                Write-Host "recent temporary directories below $tempRoot"
                Get-ChildItem -LiteralPath $tempRoot -Directory -Force -ErrorAction SilentlyContinue |
                  Where-Object { $_.LastWriteTime -ge $StartedAt.AddSeconds(-5) } |
                  Sort-Object LastWriteTime -Descending |
                  Select-Object -First 20 FullName, LastWriteTime |
                  Format-Table -AutoSize |
                  Out-String -Width 4096 |
                  Write-Host
              }
            Write-Host '::endgroup::'
          }

          function Invoke-WillDesktopSmoke {
            param(
              [Parameter(Mandatory)][string] $Executable,
              [Parameter(Mandatory)][string] $WorkingDirectory,
              [Parameter(Mandatory)][string] $DataDirectory,
              [Parameter(Mandatory)][string] $StatusFile,
              [Parameter(Mandatory)][string] $Label,
              [ValidateRange(1, 1800)][int] $ReadyTimeoutSeconds = 120,
              [string[]] $DiagnosticFiles = @()
            )

            New-Item -ItemType Directory -Force -Path $WorkingDirectory, $DataDirectory | Out-Null
            if (Test-Path -LiteralPath $StatusFile) { Remove-Item -LiteralPath $StatusFile -Force }
            $env:WILL_SMOKE_FILE = $StatusFile
            $env:WILL_SMOKE_EXIT = '1'
            $env:WILL_DATA_DIR = $DataDirectory
            $launcher = $null
            try {
              $artifact = Get-Item -LiteralPath $Executable
              Write-Host "$Label starting from $Executable ($($artifact.Length) bytes; readiness timeout ${ReadyTimeoutSeconds}s)"
              $startedAt = Get-Date
              $launcher = Start-Process -FilePath $Executable -WorkingDirectory $WorkingDirectory `
                -ArgumentList '--disable-gpu' -PassThru
              $deadline = $startedAt.AddSeconds($ReadyTimeoutSeconds)
              while (-not (Test-Path -LiteralPath $StatusFile -PathType Leaf)) {
                if ($launcher.HasExited) {
                  throw "$Label exited with code $($launcher.ExitCode) before writing its smoke result"
                }
                if ((Get-Date) -ge $deadline) {
                  Write-WillDesktopSmokeDiagnostics `
                    -Launcher $launcher `
                    -StartedAt $startedAt `
                    -Label $Label `
                    -DiagnosticFiles @($StatusFile, $DiagnosticFiles)
                  throw "$Label did not become ready within $ReadyTimeoutSeconds seconds"
                }
                Start-Sleep -Milliseconds 250
              }

              Start-Sleep -Milliseconds 250
              $result = Get-Content -LiteralPath $StatusFile -Raw | ConvertFrom-Json
              if ($result.status -ne 'ready') { throw "$Label reported startup failure: $($result.message)" }
              Write-Host "$Label ready at $($result.message)"

              if (-not $launcher.HasExited -and -not $launcher.WaitForExit(30000)) {
                throw "$Label did not exit after its successful smoke probe"
              }
            } finally {
              if ($null -ne $launcher -and -not $launcher.HasExited) {
                & taskkill.exe /pid $launcher.Id /t /f | Out-Null
                $launcher.WaitForExit()
              }
              Remove-Item Env:WILL_SMOKE_FILE -ErrorAction SilentlyContinue
              Remove-Item Env:WILL_SMOKE_EXIT -ErrorAction SilentlyContinue
              Remove-Item Env:WILL_DATA_DIR -ErrorAction SilentlyContinue
            }
          }

          $release = Join-Path $env:GITHUB_WORKSPACE 'apps/will-desktop/release'
          $productName = node -p "require('./apps/will-desktop/package.json').build.productName"
          $smokeRoot = Join-Path $env:RUNNER_TEMP "will-shell-smoke-$([guid]::NewGuid().ToString('N'))"
          New-Item -ItemType Directory -Force -Path $smokeRoot | Out-Null

          $unpackedExecutable = Join-Path $release "win-unpacked/$productName.exe"
          Invoke-WillDesktopSmoke `
            -Executable $unpackedExecutable `
            -WorkingDirectory (Join-Path $smokeRoot 'win-unpacked-work') `
            -DataDirectory (Join-Path $smokeRoot 'win-unpacked-data') `
            -StatusFile (Join-Path $smokeRoot 'win-unpacked.json') `
            -Label 'win-unpacked'

          $portableMatches = @(Get-ChildItem -LiteralPath $release -Filter 'DeepSeek-Harness-Will-Portable-*.exe')
          if ($portableMatches.Count -ne 1) { throw "Expected one Portable artifact, found $($portableMatches.Count)" }
          $portableRoot = Join-Path $smokeRoot 'portable'
          New-Item -ItemType Directory -Force -Path $portableRoot | Out-Null
          $portableExecutable = Join-Path $portableRoot $portableMatches[0].Name
          Copy-Item -LiteralPath $portableMatches[0].FullName -Destination $portableExecutable
          $portableExplicitData = Join-Path $smokeRoot 'portable-explicit-data-should-not-win'
          Invoke-WillDesktopSmoke `
            -Executable $portableExecutable `
            -WorkingDirectory $portableRoot `
            -DataDirectory $portableExplicitData `
            -StatusFile (Join-Path $smokeRoot 'portable.json') `
            -Label 'Portable wrapper' `
            -ReadyTimeoutSeconds 360 `
            -DiagnosticFiles @(
              (Join-Path $portableRoot 'DeepSeek-Harness-Will-Data/startup-error.log'),
              (Join-Path $portableExplicitData 'startup-error.log')
            )
          $portableData = Join-Path $portableRoot 'DeepSeek-Harness-Will-Data'
          if (-not (Test-Path -LiteralPath (Join-Path $portableData 'will/soul.md') -PathType Leaf)) {
            throw "Portable wrapper did not keep its data beside the executable: $portableData"
          }
          if (Test-Path -LiteralPath (Join-Path $portableExplicitData 'will') -PathType Container) {
            throw 'Portable wrapper incorrectly used WILL_DATA_DIR instead of its executable-adjacent data directory'
          }

          $setupMatches = @(Get-ChildItem -LiteralPath $release -Filter 'DeepSeek-Harness-Will-Setup-*.exe')
          if ($setupMatches.Count -ne 1) { throw "Expected one NSIS installer, found $($setupMatches.Count)" }
          $installDirectory = Join-Path $smokeRoot 'installed'
          $installer = Start-Process -FilePath $setupMatches[0].FullName -ArgumentList @('/S', "/D=$installDirectory") -Wait -PassThru
          if ($installer.ExitCode -ne 0) { throw "NSIS silent install failed with exit code $($installer.ExitCode)" }
          $installedExecutable = Join-Path $installDirectory "$productName.exe"
          if (-not (Test-Path -LiteralPath $installedExecutable -PathType Leaf)) {
            throw "NSIS did not install the desktop executable at $installedExecutable"
          }
          Invoke-WillDesktopSmoke `
            -Executable $installedExecutable `
            -WorkingDirectory (Join-Path $smokeRoot 'installed-work') `
            -DataDirectory (Join-Path $smokeRoot 'installed-data') `
            -StatusFile (Join-Path $smokeRoot 'installed.json') `
            -Label 'NSIS-installed application'

          $uninstallers = @(Get-ChildItem -LiteralPath $installDirectory -Filter 'Uninstall*.exe')
          if ($uninstallers.Count -ne 1) { throw "Expected one NSIS uninstaller, found $($uninstallers.Count)" }
          $uninstaller = Start-Process -FilePath $uninstallers[0].FullName -ArgumentList '/S' -Wait -PassThru
          if ($uninstaller.ExitCode -ne 0) { throw "NSIS silent uninstall failed with exit code $($uninstaller.ExitCode)" }

      - name: Verify tagged Windows Authenticode signatures
        if: startsWith(github.ref, 'refs/tags/will-v')
        run: |
          $release = Join-Path $env:GITHUB_WORKSPACE 'apps/will-desktop/release'
          $productName = node -p "require('./apps/will-desktop/package.json').build.productName"
          $targets = @((Get-Item -LiteralPath (Join-Path $release "win-unpacked/$productName.exe")))
          $targets += @(Get-ChildItem -LiteralPath $release -Filter 'DeepSeek-Harness-Will-Setup-*.exe')
          $targets += @(Get-ChildItem -LiteralPath $release -Filter 'DeepSeek-Harness-Will-Portable-*.exe')
          if ($targets.Count -ne 3) { throw "Expected three signed Windows executables, found $($targets.Count)" }

          foreach ($target in $targets) {
            $signature = Get-AuthenticodeSignature -LiteralPath $target.FullName
            if ($signature.Status -ne 'Valid' -or $null -eq $signature.SignerCertificate) {
              throw "Invalid Authenticode signature for $($target.Name): $($signature.Status) $($signature.StatusMessage)"
            }
            Write-Host "$($target.Name): valid Authenticode signature from $($signature.SignerCertificate.Subject)"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: DeepSeek-Harness-Will-windows-x64
          path: |
            apps/will-desktop/release/DeepSeek-Harness-Will-Setup-*.exe
            apps/will-desktop/release/DeepSeek-Harness-Will-Setup-*.exe.blockmap
            apps/will-desktop/release/DeepSeek-Harness-Will-Portable-*.exe
            apps/will-desktop/release/latest.yml
          if-no-files-found: error


  macos:
    name: macOS ${{ matrix.arch }} DMG
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
            node_platform: darwin-arm64
            output_dir: mac-arm64
          - arch: x64
            runner: macos-15-intel
            node_platform: darwin-x64
            output_dir: mac

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Require the release tag to match the desktop version
        if: startsWith(github.ref, 'refs/tags/will-v')
        run: |
          expected="${GITHUB_REF_NAME#will-v}"
          actual="$(node -p "require('./apps/will-desktop/package.json').version")"
          if [[ "$actual" != "$expected" ]]; then
            printf 'Release tag %s does not match desktop version %s\n' "$GITHUB_REF_NAME" "$actual" >&2
            exit 1
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install immutable workspace
        run: pnpm install --frozen-lockfile

      - name: Build official Harness and Will shell
        run: |
          pnpm run build
          pnpm --filter @deepseek-harness-will/desktop run build

      - name: Test Will customizations
        run: pnpm --filter @deepseek-harness-will/desktop run test

      - name: Provision verified standalone Node and npm
        run: |
          archive="node-v${NODE_VERSION}-${{ matrix.node_platform }}.tar.gz"
          base="https://nodejs.org/dist/v${NODE_VERSION}"
          download="$RUNNER_TEMP/$archive"
          checksums="$RUNNER_TEMP/SHASUMS256.txt"
          destination="$GITHUB_WORKSPACE/apps/will-desktop/runtime/node"
          curl --fail --location --output "$download" "$base/$archive"
          curl --fail --location --output "$checksums" "$base/SHASUMS256.txt"
          expected="$(awk -v archive="$archive" '$2 == archive { print $1 }' "$checksums")"
          test -n "$expected"
          actual="$(shasum -a 256 "$download" | awk '{ print $1 }')"
          test "$actual" = "$expected"
          mkdir -p "$destination"
          tar -xzf "$download" --strip-components=1 -C "$destination"
          "$destination/bin/node" --version
          "$destination/bin/npm" --version

      - name: Require Developer ID and notarization secrets for tags
        if: startsWith(github.ref, 'refs/tags/will-v')
        env:
          MACOS_CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
          MACOS_CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          missing=()
          if [[ -z "$MACOS_CSC_LINK" ]]; then missing+=(MACOS_CSC_LINK); fi
          if [[ -z "$MACOS_CSC_KEY_PASSWORD" ]]; then missing+=(MACOS_CSC_KEY_PASSWORD); fi
          if (( ${#missing[@]} != 0 )); then
            printf 'Missing required macOS signing secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi

          api_count=0
          for value in "$APPLE_API_KEY_P8" "$APPLE_API_KEY_ID" "$APPLE_API_ISSUER"; do
            if [[ -n "$value" ]]; then api_count=$((api_count + 1)); fi
          done
          apple_id_count=0
          for value in "$APPLE_ID" "$APPLE_APP_SPECIFIC_PASSWORD" "$APPLE_TEAM_ID"; do
            if [[ -n "$value" ]]; then apple_id_count=$((apple_id_count + 1)); fi
          done
          if (( api_count != 0 && api_count != 3 )); then
            echo 'APPLE_API_KEY_P8, APPLE_API_KEY_ID, and APPLE_API_ISSUER must be configured together.' >&2
            exit 1
          fi
          if (( apple_id_count != 0 && apple_id_count != 3 )); then
            echo 'APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, and APPLE_TEAM_ID must be configured together.' >&2
            exit 1
          fi
          if (( api_count != 3 && apple_id_count != 3 )); then
            echo 'Configure one complete Apple notarization credential set (API key preferred, or Apple ID).' >&2
            exit 1
          fi

      - name: Package ad-hoc-signed macOS CI artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/will-v') }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          CSC_FOR_PULL_REQUEST: 'true'
        run: |
          pnpm --filter @deepseek-harness-will/desktop exec electron-builder \
            --mac dmg \
            --${{ matrix.arch }} \
            --publish never \
            --config.mac.identity=- \
            --config.mac.forceCodeSigning=true \
            --config.mac.hardenedRuntime=false \
            --config.mac.notarize=false

      - name: Package Developer ID signed and notarized macOS release
        if: startsWith(github.ref, 'refs/tags/will-v')
        env:
          MACOS_CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
          MACOS_CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          export CSC_LINK="$MACOS_CSC_LINK"
          export CSC_KEY_PASSWORD="$MACOS_CSC_KEY_PASSWORD"
          notary_key_path=''
          cleanup_notary_key() {
            if [[ -n "$notary_key_path" ]]; then rm -f -- "$notary_key_path"; fi
          }
          trap cleanup_notary_key EXIT
          unset APPLE_API_KEY
          if [[ -n "$APPLE_API_KEY_P8" ]]; then
            unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
            notary_key_path="$RUNNER_TEMP/will-notary-api-key-${{ matrix.arch }}.p8"
            umask 077
            printf '%s\n' "$APPLE_API_KEY_P8" >"$notary_key_path"
            chmod 600 "$notary_key_path"
            export APPLE_API_KEY="$notary_key_path"
          fi
          pnpm --filter @deepseek-harness-will/desktop exec electron-builder \
            --mac dmg \
            --${{ matrix.arch }} \
            --publish never \
            --config.mac.forceCodeSigning=true \
            --config.mac.hardenedRuntime=true \
            --config.mac.notarize=true

      - name: Verify packaged macOS application
        run: |
          set -euo pipefail
          product_name="$(node -p "require('./apps/will-desktop/package.json').build.productName")"
          bundle="apps/will-desktop/release/${{ matrix.output_dir }}/$product_name.app"
          executable="$bundle/Contents/MacOS/$product_name"
          resources="$bundle/Contents/Resources"
          runtime="$resources/runtime/node/bin/node"
          plist="$bundle/Contents/Info.plist"

          test -x "$executable"
          test -x "$runtime"
          test -f "$resources/app.asar"
          test -f "$resources/app.asar.unpacked/node_modules/@deepseek-ai/dsh/lib/bin.js"
          test -f "$resources/app.asar.unpacked/node_modules/pnpm/bin/pnpm.mjs"
          test -f "$resources/icon.icns"

          test "$(ELECTRON_RUN_AS_NODE=1 "$executable" -p 'process.platform')" = 'darwin'
          test "$(ELECTRON_RUN_AS_NODE=1 "$executable" -p 'process.arch')" = '${{ matrix.arch }}'
          test "$(ELECTRON_RUN_AS_NODE=1 "$executable" -p 'process.versions.electron')" = '43.2.0'
          test "$("$runtime" -p 'process.platform')" = 'darwin'
          test "$("$runtime" -p 'process.arch')" = '${{ matrix.arch }}'
          test "$("$runtime" --version)" = "v$NODE_VERSION"

          test "$(plutil -extract CFBundleIdentifier raw -o - "$plist")" = 'org.deepseek-harness-will.desktop'
          expected_version="$(node -p "require('./apps/will-desktop/package.json').version")"
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$plist")" = "$expected_version"
          test "$(plutil -extract LSMinimumSystemVersion raw -o - "$plist")" = '12.0'

          codesign --verify --deep --strict --verbose=4 "$bundle"
          signature_info="$(codesign --display --verbose=4 "$bundle" 2>&1)"
          printf '%s\n' "$signature_info"
          if [[ "$GITHUB_REF" == refs/tags/will-v* ]]; then
            grep -F 'Authority=Developer ID Application:' <<<"$signature_info"
            grep -Eq 'flags=.*runtime' <<<"$signature_info"
            spctl --assess --type execute --verbose=4 "$bundle"
            xcrun stapler validate "$bundle"
          else
            grep -Eq 'Signature=adhoc|flags=.*adhoc' <<<"$signature_info"
          fi

          shopt -s nullglob
          dmgs=(apps/will-desktop/release/DeepSeek-Harness-Will-*-macOS-${{ matrix.arch }}.dmg)
          if (( ${#dmgs[@]} != 1 )); then
            printf 'Expected exactly one macOS DMG, found %s\n' "${#dmgs[@]}" >&2
            exit 1
          fi
          hdiutil verify "${dmgs[0]}"

      - name: Smoke packaged Harness and full Will shell
        run: |
          set -euo pipefail
          product_name="$(node -p "require('./apps/will-desktop/package.json').build.productName")"
          bundle="$GITHUB_WORKSPACE/apps/will-desktop/release/${{ matrix.output_dir }}/$product_name.app"
          executable="$bundle/Contents/MacOS/$product_name"
          resources="$bundle/Contents/Resources"

          node apps/will-desktop/scripts/smoke-packaged-harness.mjs \
            --executable "$executable" \
            --resources "$resources"

          smoke_root="$RUNNER_TEMP/will-shell-smoke-${{ matrix.arch }}"
          working_directory="$smoke_root/work"
          data_directory="$smoke_root/data"
          status_file="$smoke_root/result.json"
          output_file="$smoke_root/output.log"
          mkdir -p "$working_directory" "$data_directory"
          rm -f "$status_file"
          launcher=''
          cleanup() {
            if [[ -n "$launcher" ]] && kill -0 "$launcher" 2>/dev/null; then
              kill "$launcher" 2>/dev/null || true
              wait "$launcher" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          previous_directory="$PWD"
          cd "$working_directory"
          WILL_SMOKE_FILE="$status_file" \
            WILL_SMOKE_EXIT=1 \
            WILL_DATA_DIR="$data_directory" \
            "$executable" --disable-gpu >"$output_file" 2>&1 &
          launcher=$!
          cd "$previous_directory"

          deadline=$((SECONDS + 120))
          while [[ ! -f "$status_file" ]]; do
            if ! kill -0 "$launcher" 2>/dev/null; then
              wait "$launcher" || true
              cat "$output_file" >&2
              echo 'Will shell exited before writing its smoke result.' >&2
              exit 1
            fi
            if (( SECONDS >= deadline )); then
              cat "$output_file" >&2
              echo 'Will shell did not become ready within 120 seconds.' >&2
              exit 1
            fi
            sleep 0.25
          done

          node -e 'const fs = require("node:fs"); const result = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); if (result.status !== "ready") throw new Error(`Will shell startup failed: ${result.message}`); console.log(`Will shell ready at ${result.message}`)' "$status_file"

          exit_deadline=$((SECONDS + 30))
          while kill -0 "$launcher" 2>/dev/null; do
            if (( SECONDS >= exit_deadline )); then
              cat "$output_file" >&2
              echo 'Will shell did not exit after its successful smoke probe.' >&2
              exit 1
            fi
            sleep 0.25
          done
          set +e
          wait "$launcher"
          exit_code=$?
          set -e
          if (( exit_code != 0 )); then
            cat "$output_file" >&2
            printf 'Will shell exited with code %s after its smoke probe.\n' "$exit_code" >&2
            exit 1
          fi
          launcher=''
          trap - EXIT

      - uses: actions/upload-artifact@v4
        with:
          name: DeepSeek-Harness-Will-macOS-${{ matrix.arch }}
          path: apps/will-desktop/release/DeepSeek-Harness-Will-*-macOS-${{ matrix.arch }}.dmg
          if-no-files-found: error

  release:
    name: Publish tagged GitHub Release
    if: startsWith(github.ref, 'refs/tags/will-v')
    needs: [windows-x64, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v5
        with:
          pattern: DeepSeek-Harness-Will-*
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release with Windows and macOS assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#will-v}"
          gh release create "$GITHUB_REF_NAME" release-assets/* --verify-tag --notes-file .github/release-notes/current.txt --title "Deepseek Harness Will — 组装未来 v$version"
